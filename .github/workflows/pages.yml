name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS files
        run: git lfs pull

      - name: Verify WebGL.data is not an LFS pointer
        run: |
          set -euo pipefail
          FILE="moderator/Build/WebGL.data"
          SIZE=$(stat -c%s "$FILE")
          echo "$FILE is ${SIZE} bytes"
          if head -c 20 "$FILE" | grep -q "version https://"; then
            echo "::error::$FILE is still a Git LFS pointer. GitHub Pages cannot serve that."
            head -n 5 "$FILE"
            exit 1
          fi
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::$FILE is too small to be a Unity data file."
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
